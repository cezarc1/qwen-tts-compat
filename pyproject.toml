[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts-compat"
version = "0.1.1.post1"
description = "Unofficial Qwen3-TTS fork with Transformers 5.x compatibility"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  # Upstream pins ==4.57.3; the shims in qwen_tts/core/_compat.py span 4.57.x
  # and 5.x, so the pin is relaxed to allow co-installation with Qwen3-ASR.
  "transformers>=4.57.3,<6",
  "accelerate>=1.12.0",
  "gradio",
  "librosa",
  "torchaudio",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[project.urls]
# Upstream points at github.com/Qwen/Qwen3-TTS, which does not exist.
Homepage = "https://github.com/QwenLM/Qwen3-TTS"
Repository = "https://github.com/QwenLM/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]