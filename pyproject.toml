[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tts-compat"
version = "0.1.1.post1"
description = "Unofficial Qwen3-TTS fork that runs on Transformers 5.x"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]

dependencies = [
  # This fork exists to run on Transformers 5.x, so it requires it. Verified on
  # 5.14.1; 5.9 is the lowest release these changes have been reported against.
  # For Transformers 4.57.x, use upstream `qwen-tts` instead.
  "transformers>=5.9,<6",
  "accelerate>=1.12.0",
  "gradio",
  "librosa",
  "torchaudio",
  "soundfile",
  "sox",
  "onnxruntime",
  "einops",
]

[project.urls]
# Upstream points at github.com/Qwen/Qwen3-TTS, which does not exist.
Homepage = "https://github.com/QwenLM/Qwen3-TTS"
Repository = "https://github.com/QwenLM/Qwen3-TTS"

[project.scripts]
qwen-tts-demo = "qwen_tts.cli.demo:main"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_tts*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_tts = ["py.typed", "**/*.npz"]