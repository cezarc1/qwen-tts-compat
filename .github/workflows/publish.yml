name: Publish to PyPI

# Publishes on a version tag using PyPI Trusted Publishing (OIDC): PyPI verifies
# the workflow identity directly, so no API token is stored anywhere.
#
# Hardening notes:
#   * Every action is pinned to a full commit SHA, not a tag. Tags are mutable,
#     and this workflow holds `id-token: write` — the permission that mints PyPI
#     credentials — so a repointed tag would be able to publish under this name.
#   * Nothing interpolates event data (issue/PR titles, commit messages, branch
#     names), so there is no workflow-injection surface.
#   * Permissions are empty by default and granted per job.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # astral-sh/setup-uv@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx --from twine==6.2.0 twine check --strict dist/*

      # actions/upload-artifact@v5
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured on the PyPI publisher. Add a required
    # reviewer to this environment so a tag push alone cannot publish.
    environment:
      name: pypi
      url: https://pypi.org/p/qwen-tts-compat
    permissions:
      # Required for Trusted Publishing; mints the short-lived OIDC token.
      id-token: write
    steps:
      # actions/download-artifact@v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish@release/v1
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          # PEP 740 provenance attestations, so consumers can verify these
          # artifacts were built by this workflow from this repository.
          attestations: true
