name: Publish to PyPI

# Publishes on a version tag. Uses PyPI Trusted Publishing (OIDC), so no API
# token is stored anywhere: PyPI verifies the workflow identity directly.
#
# Note: nothing here interpolates event data (issue/PR titles, commit messages,
# branch names), so there is no workflow-injection surface.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment configured on the PyPI publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/qwen-tts-compat
    permissions:
      # Required for Trusted Publishing; mints the short-lived OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
